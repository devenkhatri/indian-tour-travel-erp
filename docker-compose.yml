services:
  # ----------------------------------------------------------------------------
  # Laravel PHP-FPM Application Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: travelcrm_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - build_data:/var/www/html/public/build
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travelcrm_network

  # ----------------------------------------------------------------------------
  # Nginx Web Server Reverse Proxy
  # ----------------------------------------------------------------------------
  web:
    image: nginx:1.27-alpine
    container_name: travelcrm_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - build_data:/var/www/html/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - travelcrm_network

  # ----------------------------------------------------------------------------
  # MySQL 8.0 Relational Database Service
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: travelcrm_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-travelcrm}
      MYSQL_USER: ${DB_USERNAME:-travelcrm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${DB_ROOT_PASSWORD:-root_secret} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - travelcrm_network

  # ----------------------------------------------------------------------------
  # Redis 7 In-Memory Cache, Session & Queue Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: travelcrm_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - travelcrm_network

  # ----------------------------------------------------------------------------
  # Laravel Queue Worker (Async Invoices, Vouchers, Emails)
  # ----------------------------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: travelcrm_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travelcrm_network

  # ----------------------------------------------------------------------------
  # Laravel Task Scheduler (Periodic Cron Work)
  # ----------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: travelcrm_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - travelcrm_network

  # ----------------------------------------------------------------------------
  # Mailpit Local Email Testing (Web Inbox on :8025, SMTP on :1025)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: travelcrm_mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_PORT:-8025}:8025"
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - travelcrm_network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  build_data:
    driver: local

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  travelcrm_network:
    driver: bridge
